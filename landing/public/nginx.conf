# ==============================================================================
# Refinzi Landing Page - Nginx Static Serving & Expires Configuration
# ==============================================================================

server {
    listen 80;
    server_name refinzi.com www.refinzi.com;
    root /var/www/refinzi;
    index index.html;

    # Static assets caching with 1 year Expires header and immutable Cache-Control
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Expires "Thu, 31 Dec 2037 23:59:59 GMT";
        access_log off;
    }

    # Manifest and discovery metadata
    location ~* \.(?:txt|xml)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML routes (Always revalidate to pick up newly deployed builds)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Expires "0";
    }

    # Single Page App fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
